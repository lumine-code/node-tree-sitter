name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm run setup:wasmtime
      - run: npm ci
      - run: npm run lint
      - run: npm run check:types
      - run: npm test
      - run: xvfb-run -a npm run test:electron
        if: runner.os == 'Linux'
      - run: npm run test:electron
        if: runner.os != 'Linux'
      - run: npm pack --dry-run
